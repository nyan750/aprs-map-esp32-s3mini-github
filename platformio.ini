; APRS Map Viewer - ESP32-S3 Super Mini port
; Board: ESP32-S3 Super Mini (4 MB flash, no PSRAM)
; LCD: 2.8" TFT SPI module 240x320 (ILI9341-class) with resistive
; touch (XPT2046), wired as in include/LGFX_S3.h - see README.
[env:esp32-s3-supermini]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_mapgen.csv

lib_deps =
    lovyan03/LovyanGFX@^1.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; S3 v29b: variant for a NON-touch LCD - 4 push buttons on
; GPIO4/5/6/7 replace the touch panel (the touch bus pins are free
; because there is no touch controller). Splash shows "S3 v29b".
[env:esp32-s3-supermini-btn]
extends = env:esp32-s3-supermini
build_flags =
    ${env:esp32-s3-supermini.build_flags}
    -DBUTTON_UI=1

; S3 v30: 3.5" 480x320 ILI9488 module (no touch) + buttons.
; Splash shows "S3 v40".
[env:esp32-s3-supermini-35]
extends = env:esp32-s3-supermini-btn
build_flags =
    ${env:esp32-s3-supermini-btn.build_flags}
    -DLCD35=1

; 3.5" 480x320 ILI9488 module WITH touch (XPT2046, same wiring as
; the 2.8" touch build) - LCD35 without BUTTON_UI. Splash "S3 v40t".
[env:esp32-s3-supermini-35touch]
extends = env:esp32-s3-supermini
build_flags =
    ${env:esp32-s3-supermini.build_flags}
    -DLCD35=1
